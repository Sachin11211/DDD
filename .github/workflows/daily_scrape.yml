name: Daily Product Scrape

on:
  schedule:
    # Runs at 3:00 AM UTC (~8:30 AM IST) every day
    - cron: "30 3 * * *"
  workflow_dispatch: {}   # allows manual trigger from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated database
        run: |
          git config user.name "ddd-bot"
          git config user.email "ddd-bot@users.noreply.github.com"
          git add ddd.db
          git diff --staged --quiet || git commit -m "Daily scrape: $(date -u +%F)"
          git push
